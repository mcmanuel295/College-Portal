spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: lecturer-service

  datasource:
    url: jdbc:mysql://localhost:3307/lecturersDb?createDatabaseIfNotExist=true
    username: root
    password: lecturer
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    generate-ddl: true

  rabbitmq:
    username: admin
    password: admin
    host: localhost
    port: 5672

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:mcmanuel755@gmail.com}
    password: ${GMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8081