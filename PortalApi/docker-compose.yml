services:
  student-db:
    image: mysql:8.4
    container_name: student-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: student
      MYSQL_DATABASE: studentsDb
    volumes:
      - student:/var/lib/mysql
    networks:
      - student-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pstudent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  course-db:
    image: mysql:8.4
    container_name: course-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: course
      MYSQL_DATABASE: courseDb
    volumes:
      - course:/var/lib/mysql
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcourse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"     # EXTERNAL  -> for apps running on your host
    environment:
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

      # --- Listeners ---
      # CONTROLLER = internal controller traffic
      # PLAINTEXT  = in-network clients (other containers)
      # EXTERNAL   = host-machine clients
      KAFKA_LISTENERS: 'CONTROLLER://0.0.0.0:29093,PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"

      # --- Single-node replication settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1


      # --- Logs ---
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_kraft:/var/lib/kafka/data
    networks:
      - student-network
      - course-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

networks:
  student-network:
  course-network:

volumes:
  student:
  course:
  kafka_kraft: