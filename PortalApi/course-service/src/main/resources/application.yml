spring:
  application:
    name: course-service
  profiles:
    active:
      - dev

  datasource:
    url: jdbc:mysql://localhost:3308/coursesDb?createDatabaseIfNotExist=true
    password: course
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    show-sql: false
    hibernate:
      ddl-auto: update

server:
  port: 8082

